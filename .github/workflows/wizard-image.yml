# WizardOS Hermes fork image (wizard-os#723). Copy to .github/workflows/wizard-image.yml in the fork
# (defleur-agents/hermes-agent). It lives in wizard-os only as the reviewed source: it does not run here.
#
# Builds the fork's own commit into ghcr.io/<fork owner>/hermes-agent:sha-<full commit> for linux/amd64 and
# linux/arm64 on native runners, labels both with org.opencontainers.image.revision = that full commit, and
# writes the multi-arch digest to the run summary. tools/hermes_fork_candidate.py in wizard-os turns that into
# a candidate snapshot. The package starts private (GHCR's default for a new package); it has to be made public
# before any fresh install can pull it (everything a fresh install downloads must be public).
name: Wizard fork image

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Fork commit to build (40-char sha). Empty = the branch head.
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wizard-image-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

env:
  COMMIT: ${{ inputs.commit || github.sha }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - id: name
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-char sha"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$COMMIT" ]
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hermes-agent" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Write install stamp
        run: |
          python3 scripts/write_install_stamp.py --output install-stamp.json \
            --distribution docker --update-mechanism external --source ci --commit "${{ steps.name.outputs.commit }}"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            HERMES_BOT_DESKTOP=0
          labels: |
            org.opencontainers.image.revision=${{ steps.name.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=WizardOS Hermes fork ${{ steps.name.outputs.commit }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One multi-arch tag, digest in the summary
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" = 2 ]
          tag="$IMAGE:sha-$COMMIT"
          docker buildx imagetools create -t "$tag" $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          for arch in amd64 arm64; do
            rev=$(docker buildx imagetools inspect "$tag" --format "{{json .Image}}" | python3 -c "import json,sys; print(json.load(sys.stdin)['linux/$arch']['config']['Labels']['org.opencontainers.image.revision'])")
            [ "$rev" = "$COMMIT" ] || { echo "::error::linux/$arch revision $rev != $COMMIT"; exit 1; }
          done
          {
            echo "### Wizard fork image"
            echo
            echo "- ref: \`$tag\`"
            echo "- digest: \`$digest\`"
            echo "- source-revision (amd64 + arm64): \`$COMMIT\`"
            echo
            echo "Candidate snapshot (in wizard-os):"
            echo
            echo "\`python3 tools/hermes_fork_candidate.py --fork-commit $COMMIT --digest $digest --ci-run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID --test-record <forum run link>\`"
          } >> "$GITHUB_STEP_SUMMARY"
